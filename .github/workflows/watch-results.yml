name: Watch tournament results
run-name: Tournament watch until ${{ inputs.end_at }}
on:
  workflow_dispatch:
    inputs:
      start_at:
        description: Watch window start (UTC ISO timestamp)
        required: true
        type: string
      end_at:
        description: Stop checking at this UTC time (maximum four hours)
        required: true
        type: string
      replaces_check:
        description: Optional progress check ID of a cancelled run
        required: false
        type: string
permissions:
  contents: write
  pages: write
  checks: write
  issues: write
concurrency:
  group: tournament-results-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      GH_TOKEN: ${{ github.token }}
      WATCH_START: ${{ inputs.start_at }}
      WATCH_END: ${{ inputs.end_at }}
      WATCH_REPLACES_CHECK: ${{ inputs.replaces_check }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Configure snapshot commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Check, validate, publish, and repeat until cutoff
        run: node scripts/watch.mjs
      - name: Notify if the watcher stops unexpectedly
        if: failure()
        run: node scripts/watch.mjs --failure
      - name: Save watch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tournament-watch-log
          path: |
            .local/watch-status.json
            .local/watch.jsonl
            .local/watch-diff.json
          include-hidden-files: true
          retention-days: 7
